spring.application.name=elocheck

# Conexion a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/elocheck?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

 
# ─────────────────────────────────────────────
#  API del Clima (Open-Meteo, gratis sin API key)
# ─────────────────────────────────────────────
openmeteo.base-url=https://api.open-meteo.com/v1/forecast
openmeteo.default-latitude=-33.45
openmeteo.default-longitude=-70.67

# Manejo de errores 404
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Logs
logging.level.root=INFO
logging.level.com.duoc.elocheck=DEBUG