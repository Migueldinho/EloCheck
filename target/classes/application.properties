spring.application.name=EloCheck

# Conexion a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/elocheck?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-Meteo
openmeteo.base-url=https://api.open-meteo.com/v1/forecast
openmeteo.default-latitude=-33.45
openmeteo.default-longitude=-70.67