spring.application.name=elocheck
server.port=${PORT:8080}

# Conexion a MySQL (valores sensibles por variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

 
# ─────────────────────────────────────────────
#  API del Clima (Open-Meteo, gratis sin API key)
# ─────────────────────────────────────────────
openmeteo.base-url=${OPENMETEO_BASE_URL}
openmeteo.default-latitude=-33.45
openmeteo.default-longitude=-70.67

# Manejo de errores 404
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Logs
logging.level.root=INFO
logging.level.com.duoc.elocheck=DEBUG

# Spring Security - JWT
# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
# JwtUtil lee JWT_SECRET directamente desde la variable de entorno