# ─────────────────────────────────────────────
#  Base de datos H2 (en memoria, sin instalar nada)
#  Perfecta para desarrollo y pruebas
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:elocheck
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# Hibernate crea las tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=create-drop
 
# Muestra el SQL que ejecuta JPA (útil para ver qué hace)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# Consola web de H2: puedes ver tus tablas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# ─────────────────────────────────────────────
#  API del Clima (Open-Meteo, gratis sin API key)
# ─────────────────────────────────────────────
openmeteo.base-url=https://api.open-meteo.com/v1/forecast
openmeteo.default-latitude=-33.45
openmeteo.default-longitude=-70.67
 